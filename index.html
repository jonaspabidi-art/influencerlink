<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mina favoriter</title>
  <meta name="description" content="Alla produkter jag tipsar om på TikTok, samlade på ett ställe.">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="Mina favoriter">
  <meta property="og:description" content="Alla produkter jag tipsar om på TikTok, samlade på ett ställe.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="profile">
      <img id="profile-image" class="profile__avatar" src="" alt="" width="96" height="96" hidden>
      <h1 id="profile-name" class="profile__name">&nbsp;</h1>
      <p id="profile-tagline" class="profile__tagline"></p>
    </header>

    <!-- Lagkrav: annonsmärkning ska synas utan att scrolla. Ta inte bort. -->
    <p class="disclosure">
      Sidan innehåller annonslänkar – jag får provision om du handlar via dem
    </p>

    <nav id="filters" class="filters" aria-label="Filtrera på kategori"></nav>

    <main>
      <p id="status" class="status" role="status" aria-live="polite">Laddar produkter…</p>
      <ul id="products" class="products"></ul>
    </main>

    <footer class="footer">
      <p id="footer-note"></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
