services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: influencerlink
      POSTGRES_PASSWORD: influencerlink
      POSTGRES_DB: influencerlink
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U influencerlink']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
