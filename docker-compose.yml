services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pacta
      POSTGRES_PASSWORD: pacta
      POSTGRES_DB: pacta
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pacta']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
