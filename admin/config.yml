# Decap CMS – adminen på /admin
#
# Inloggning sker med ditt GitHub-konto via Netlifys OAuth.
# Ändrar du något här: spara, vänta ut Netlify-bygget, ladda om /admin.

backend:
  name: github
  repo: jonaspabidi-art/influencerlink
  branch: main
  commit_messages:
    create: 'Lägg till {{collection}} via admin'
    update: 'Uppdatera {{collection}} via admin'
    delete: 'Ta bort {{collection}} via admin'
    uploadMedia: 'Ladda upp {{path}}'
    deleteMedia: 'Ta bort {{path}}'

# Bilder du laddar upp hamnar i bilder/ i repot och nås som /bilder/fil.jpg
media_folder: bilder
public_folder: /bilder

collections:
  - name: innehall
    label: Innehåll
    files:
      - name: sida
        label: Produkter och profil
        file: products.json
        format: json
        description: >-
          Nyast först på sidan styrs av "Tillagd". Bilder visas i 4:5 och
          beskärs från mitten – ladda upp stående bilder.
        fields:
          - label: Profil
            name: profile
            widget: object
            collapsed: true
            fields:
              - { label: Kontonamn, name: name, widget: string }
              - { label: Rad under namnet, name: tagline, widget: string, required: false }
              - { label: Profilbild, name: image, widget: image, required: false }
              - { label: Text längst ner på sidan, name: footerNote, widget: string, required: false }

          - label: Kategorier
            name: categories
            widget: list
            collapsed: true
            label_singular: Kategori
            summary: '{{fields.label}}'
            hint: >-
              Lägger du till en kategori här måste den också läggas till som
              alternativ i admin/config.yml för att dyka upp i listan nedan.
            fields:
              - { label: 'ID (små bokstäver, inga å/ä/ö)', name: id, widget: string }
              - { label: Namn på knappen, name: label, widget: string }

          - label: Produkter
            name: products
            widget: list
            label_singular: Produkt
            summary: '{{fields.name}} — {{fields.dateAdded}}'
            fields:
              - { label: Namn, name: name, widget: string }
              - label: Beskrivning
                name: description
                widget: text
                hint: En eller två meningar. Håll det kort – det ska rymmas under bilden.
              - label: Bild
                name: image
                widget: image
                hint: Stående, gärna 800×1000. Liggande bilder får toppen och botten bortklippta.
              - label: Affiliatelänk
                name: url
                widget: string
                pattern: ['^https://', 'Länken måste börja med https://']
              - label: Kategori
                name: category
                widget: select
                options:
                  - { label: Kök, value: kok }
                  - { label: Träning, value: traning }
                  - { label: Inredning, value: inredning }
                  - { label: Kläder, value: klader }
              - label: Tillagd
                name: dateAdded
                widget: datetime
                format: 'YYYY-MM-DD'
                date_format: 'YYYY-MM-DD'
                time_format: false
                picker_utc: true
                hint: Styr ordningen på sidan. Nyast hamnar överst.
